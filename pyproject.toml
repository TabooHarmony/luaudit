[project]
name = "luaudit"
version = "1.1.0"
description = "Automatic Luau diagnostics for AI coding agents. Plugin for Claude Code and Codex (luau-lsp + selene + stylua, zero config)."
readme = "README.md"
license = {text = "MPL-2.0"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
luaudit = "luaudit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luaudit"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/luaudit/studio/luaudit-mirror.rbxmx" = "luaudit/plugin_data/luaudit-mirror.rbxmx"

[tool.pytest.ini_options]
testpaths = ["tests"]
